name: Build NethrionRanks

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build
        run: gradle clean build --no-daemon --no-configuration-cache --refresh-dependencies

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NethrionRanks
          path: build/libs/*.jar
