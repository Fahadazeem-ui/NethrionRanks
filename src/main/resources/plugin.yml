name: NethrionRanks
version: '${version}'
main: com.nethrion.ranks.Main
api-version: '1.21'
author: Nethrion
description: Rank, Skills, Base Protection and RankDuel system for Nethrion SMP
softdepend: [PlaceholderAPI]

commands:
  rank:
    description: Apna current rank aur ladder progression dekho
    usage: /rank
  skills:
    description: Apne skill stats aur levels dekho
    usage: /skills
  base:
    description: Apna base set karo aur uski activity logs dekho
    usage: /base <set|logs> [time]
  rankduel:
    description: Kisi player ko 1v1 duel ke liye challenge karo
    usage: /rankduel <player> | /rankduel accept <player>

