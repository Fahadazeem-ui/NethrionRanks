name: NethrionRanks
version: '1.1.0'
main: com.nethrion.ranks.Main
api-version: '1.21'
author: Nethrion
description: Ranked progression, formal duels, permanent combat skills, custom Spear and base audit system.
softdepend: [PlaceholderAPI, NethrionTeams]

permissions:
  nethrionranks.admin:
    description: Admin commands for NethrionRanks
    default: op

commands:
  rank:
    description: Current rank, progression, ladder and admin tools
    usage: /rank | /rank list | /rank help | /rank set <player> <tier> [skill] | /rank giveweapon <player> <skill> <tier> | /rank removeweapon <player> [skill]

  rankgui:
    description: Open the NethrionRanks GUI panel
    usage: /rankgui [player]

  skills:
    description: Permanent combat mastery and leaders
    usage: /skills | /skills board

  base:
    description: Three-slot full-height base audit system
    usage: /base <set|list|logs|delete>

  rankduel:
    description: Formal ranked 1v1 duel
    usage: /rankduel <player> | /rankduel accept <player>

  killcount:
    description: Your formal ranked duel kill count
    usage: /killcount

  killtop:
    description: Top three formal ranked duel killers
    usage: /killtop

  pvp:
    description: Personal PvP toggle
    usage: /pvp | /pvp on | /pvp off

  kill:
    description: Operator-only kill count administration
    usage: /kill set <username> <count>

  apply:
    description: Apply for specialized ranks (e.g. /apply miner)
    usage: /apply <rank>

  requests:
    description: Operator-only rank resignation requests review
    usage: /requests [approve|deny|list] <player>
    permission: nethrionranks.admin
